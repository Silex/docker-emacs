---
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: 0 3 * * *

# The nightly run and a push to main would otherwise overlap, pushing the same
# tags and writing the same cache refs while clean prunes them. Pull requests
# supersede each other instead of queueing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1

      - name: Check that the generated files are up to date
        run: bin/images --check

  matrix:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      os:      ${{ env.os }}
      version: ${{ env.version }}
      include: ${{ env.include }}
      exclude: ${{ env.exclude }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1

      - name: Setup variables
        run: |
          images="$(bin/images --json)"
          {
            echo "os=$(jq -c '.oses' <<< "$images")"
            echo "version=$(jq -c '.versions' <<< "$images")"
            echo "include=$(jq -c '.github.include' <<< "$images")"
            echo "exclude=$(jq -c '.github.exclude' <<< "$images")"
          } >> "$GITHUB_ENV"

  build:
    needs: matrix
    # Pull requests from forks receive no secrets nor variables, so they cannot
    # reach the registry mirror and would exhaust Docker Hub's anonymous pull
    # quota. Contributors verify their images locally instead, see README.md.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # The "include:" block will inject "subdirs:" into the matrix
      matrix:
        version: ${{ fromJson(needs.matrix.outputs.version) }}
        os:      ${{ fromJson(needs.matrix.outputs.os) }}
        include: ${{ fromJson(needs.matrix.outputs.include) }}
        exclude: ${{ fromJson(needs.matrix.outputs.exclude) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # bin/build reads SOURCE_DATE_EPOCH from each Dockerfile's last commit.
          fetch-depth: 0

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to registry mirror
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ vars.MIRROR_HOST }}
          username: ${{ vars.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["https://${{ vars.MIRROR_HOST }}"]

      - uses: ruby/setup-ruby@v1

      - name: Build and push images for ${{ matrix.version }} (${{ matrix.os }})
        run: bin/build --os ${{ matrix.os }} --version ${{ matrix.version }} --subdirs ${{ join(matrix.subdirs, ',') }}

  clean:
    needs: build
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          package: emacs-cache
          token: ${{ secrets.GITHUB_TOKEN }}

  summary:
    needs: clean
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1

      - name: Summarize jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bin/jobs-summary >> "$GITHUB_STEP_SUMMARY"
